<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Atendimento</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .btn-adm-topo { 
            background: #333; 
            color: white; 
            padding: 8px 16px; 
            text-decoration: none; 
            border-radius: 20px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 12px; 
        }
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box; 
        }
        h2 { margin-top: 0; color: #333; text-align: center; border-bottom: 2px solid #25d366; padding-bottom: 10px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input, select { 
            width: 100%; 
            padding: 14px 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fff;
        }
        .btn-acao { 
            width: 100%; 
            padding: 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
        }
        button:disabled {
            background: #ccc !important;
            color: #666 !important;
            cursor: not-allowed;
        }
        /* POPUP/MODAL DE CONFIRMAÇÃO */
        .modal-sucesso {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            z-index: 9999;
        }
        .modal-conteudo {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-whats-final {
            display: block;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

<a href="admin.html" class="btn-adm-topo">⚙️ Painel de Controle</a>

<div class="box">
    <h2>Agendar Atendimento</h2>
    <form id="formCliente">
        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="telefone">Seu WhatsApp:</label>
            <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
            <label for="servico">Escolha o Serviço:</label>
            <select id="servico" required>
                <option value="Serviço Padrão 1">Serviço Padrão 1</option>
                <option value="Serviço Completo 2">Serviço Completo 2</option>
                <option value="Consulta Avançada">Consulta Avançada</option>
                <option value="Manutenção Geral">Manutenção Geral</option>
            </select>
        </div>
        <div class="form-group">
            <label for="data">Escolha o Dia:</label>
            <input type="date" id="data" required onchange="atualizarHorariosDaData()">
        </div>
        <div class="form-group">
            <label for="horario">Escolha o Horário:</label>
            <select id="horario" required onchange="validarBotao()"></select>
        </div>
        <button type="submit" id="btnEnviar" class="btn-acao">Avançar Agendamento</button>
    </form>
</div>

<!-- TELA POPUP QUE VAI APARECER APÓS O CLIQUE -->
<div id="meuModal" class="modal-sucesso">
    <div class="modal-conteudo">
        <h3 style="color: #28a745; margin-top: 0;">🎉 Quase Pronto!</h3>
        <p style="color: #555; font-size: 15px; line-height: 1.4;">Seus dados foram reservados no sistema. Agora, clique no botão abaixo para enviar o comprovante e finalizar pelo WhatsApp.</p>
        <a id="linkWhatsFinal" href="#" class="btn-whats-final">🟢 ENVIAR NO WHATSAPP</a>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO: INSIRA SEU WHATSAPP REAL AQUI
    // IMPORTANTE: Use o formato "55" + DDD + Número. Apenas números!
    const SEU_NUMERO_WHATSAPP = "5583998057576"; 
    // ==========================================

    const hoje = new Date().toISOString().split('T');
    document.getElementById('data').value = hoje;
    document.getElementById('data').min = ServerDate();

    function ServerDate() { return hoje[0]; }

    function atualizarHorariosDaData() {
        const dataSelecionada = document.getElementById('data').value;
        if (!dataSelecionada) return;

        const agendaPorDia = JSON.parse(localStorage.getItem('agendaPorDia')) || {};
        const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];

        let horariosDisponiveis = agendaPorDia[dataSelecionada] || [];
        const horariosOcupados = agendamentos.filter(a => a.data === dataSelecionada).map(a => a.hora);
        const horariosLivres = horariosDisponiveis.filter(hora => !horariosOcupados.includes(hora));

        const selectHorario = document.getElementById('horario');
        selectHorario.innerHTML = '';
        
        if (horariosLivres.length === 0) {
            let option = document.createElement('option');
            option.textContent = "Nenhum horário livre";
            option.value = "";
            selectHorario.appendChild(option);
        } else {
            horariosLivres.forEach(hora => {
                let option = document.createElement('option');
                option.value = hora;
                option.textContent = hora;
                selectHorario.appendChild(option);
            });
        }
        validarBotao();
    }

    function validarBotao() {
        const btn = document.getElementById('btnEnviar');
        const horaVal = document.getElementById('horario').value;
        
        if (!horaVal || horaVal === "") {
            btn.disabled = true;
            btn.textContent = "Agenda Fechada para este Dia";
            btn.style.background = "#ccc";
        } else {
            btn.disabled = false;
            btn.textContent = "Avançar Agendamento";
            btn.style.background = "#007bff";
        }
    }

    document.getElementById('formCliente').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const horaSel = document.getElementById('horario').value;
        if (!horaSel || horaSel === "") return;

        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value;
        const servico = document.getElementById('servico').value;
        const data = document.getElementById('data').value;
        const dataFormatada = data.split('-').reverse().join('/');

        const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
        const novoAgendamento = { id: Date.now(), nome, telefone, servico, data, hora: horaSel };
        agendamentos.push(novoAgendamento);
        localStorage.setItem('agendamentos', JSON.stringify(agendamentos));

        const textoMensagem = "Olá! Gostaria de confirmar um agendamento:\n\n" +
                              "👤 Nome: " + nome + "\n" +
                              "📱 Contato: " + telefone + "\n" +
                              "🛠️ Serviço: " + servico + "\n" +
                              "📅 Data: " + dataFormatada + "\n" +
                              "⏰ Horário: " + horaSel;

        const urlLinkLink = "https://whatsapp.com" + SEU_NUMERO_WHATSAPP + "&text=" + encodeURIComponent(textoMensagem);

        // Configura o link do botão final do WhatsApp dentro do popup
        document.getElementById('linkWhatsFinal').href = urlLinkLink;

        // Abre a caixinha de aviso na tela do cliente
        document.getElementById('meuModal').style.display = "flex";

        // Limpa o formulário de fundo
        document.getElementById('formCliente').reset();
        document.getElementById('data').value = hoje;
        atualizarHorariosDaData();
    });

    window.addEventListener('storage', function() { atualizarHorariosDaData(); });
    atualizarHorariosDaData();
</script>
</body>
</html>
