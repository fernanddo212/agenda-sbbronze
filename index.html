<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Atendimento</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .btn-adm-topo { 
            background: #333; 
            color: white; 
            padding: 8px 16px; 
            text-decoration: none; 
            border-radius: 20px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 12px; 
        }
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box; 
        }
        h2 { margin-top: 0; color: #333; text-align: center; border-bottom: 2px solid #25d366; padding-bottom: 10px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input, select { 
            width: 100%; 
            padding: 14px 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fff;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #25d366; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

<a href="admin.html" class="btn-adm-topo">⚙️ Painel de Controle</a>

<div class="box">
    <h2>Agendar Atendimento</h2>
    <form id="formCliente">
        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="telefone">Seu WhatsApp:</label>
            <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
            <label for="servico">Escolha o Serviço:</label>
            <select id="servico" required>
                <option value="Serviço Padrão 1">Serviço Padrão 1</option>
                <option value="Serviço Completo 2">Serviço Completo 2</option>
                <option value="Consulta Avançada">Consulta Avançada</option>
                <option value="Manutenção Geral">Manutenção Geral</option>
            </select>
        </div>
        <div class="form-group">
            <label for="data">Escolha o Dia:</label>
            <input type="date" id="data" required onchange="atualizarHorariosDaData()">
        </div>
        <div class="form-group">
            <label for="horario">Escolha o Horário:</label>
            <select id="horario" required></select>
        </div>
        <button type="submit">Confirmar pelo WhatsApp</button>
    </form>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO: INSIRA SEU WHATSAPP REAL AQUI
    // Apenas números! Exemplo: "5511999999999"
    const SEU_NUMERO_WHATSAPP = "5500000000000"; 
    // ==========================================

    // Define a data mínima como hoje automaticamente
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('data').value = hoje;
    document.getElementById('data').min = hoje;

    function atualizarHorariosDaData() {
        const dataSelecionada = document.getElementById('data').value;
        if (!dataSelecionada) return;

        const agendaPorDia = JSON.parse(localStorage.getItem('agendaPorDia')) || {};
        const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];

        let horariosDisponiveis = agendaPorDia[dataSelecionada] || [];
        const horariosOcupados = agendamentos.filter(a => a.data === dataSelecionada).map(a => a.hora);
        const horariosLivres = horariosDisponiveis.filter(hora => !horariosOcupados.includes(hora));

        const selectHorario = document.getElementById('horario');
        selectHorario.innerHTML = '';
        
        if (horariosLivres.length === 0) {
            let option = document.createElement('option');
            option.textContent = "Nenhum horário livre para este dia";
            option.value = "";
            selectHorario.appendChild(option);
            return;
        }

        horariosLivres.forEach(hora => {
            let option = document.createElement('option');
            option.value = hora;
            option.textContent = hora;
            selectHorario.appendChild(option);
        });
    }

    document.getElementById('formCliente').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const horaSel = document.getElementById('horario').value;
        if (!horaSel) {
            alert('Por favor, selecione um dia que possua horários livres.');
            return;
        }

        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value;
        const servico = document.getElementById('servico').value;
        const data = document.getElementById('data').value;
        const dataFormatada = data.split('-').reverse().join('/');

        // Salva localmente para aparecer no painel adm
        const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
        const novoAgendamento = { id: Date.now(), nome: nome, telefone: telefone, servico: servico, data: data, hora: horaSel };
        agendamentos.push(novoAgendamento);
        localStorage.setItem('agendamentos', JSON.stringify(agendamentos));

        // Monta o texto limpo para a API do WhatsApp
        const textoMensagem = "Olá! Gostaria de confirmar um agendamento:\n\n" +
                              "👤 Nome: " + nome + "\n" +
                              "📱 Contato: " + telefone + "\n" +
                              "🛠️ Serviço: " + servico + "\n" +
                              "📅 Data: " + dataFormatada + "\n" +
                              "⏰ Horário: " + horaSel;

        const urlLinkLink = "https://whatsapp.com" + SEU_NUMERO_WHATSAPP + "&text=" + encodeURIComponent(textoMensagem);

        // Limpa o formulário antes de ir para o WhatsApp
        document.getElementById('formCliente').reset();
        document.getElementById('data').value = hoje;
        atualizarHorariosDaData();

        // Envio definitivo aceito por qualquer celular
        window.location.href = urlLinkLink;
    });

    window.addEventListener('storage', function() { atualizarHorariosDaData(); });
    atualizarHorariosDaData();
</script>
</body>
</html>
